name: Sync from Gitee

on:
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨2点（UTC）自动同步
  workflow_dispatch:       # 也支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from Gitee
        run: |
          git remote add gitee ${{ secrets.GITEE_REPO_URL }} || git remote set-url gitee ${{ secrets.GITEE_REPO_URL }}
          git fetch gitee --tags
          git checkout main
          git merge gitee/main --allow-unrelated-histories --no-edit || true
          git push origin main --tags
